title = "Unreal Tournament Weapons & Movement";
description = "Experience the classic Unreal Tournament weapons from the far future of 2004, now in the End Times. They come with UT’s hectic movement, multi-kills, the iconic announcer and adrenaline combos.\n\n[h1]Features[/h1]\n[list]\n[*][b]11 weapons[/b] - 2 in the melee slot, 8 in the ranged slot, plus one career skill.\n[*][b]Crafting[/b] - craft, upgrade, reroll traits and apply illusions to the new weapons.\n[*][b]Movement[/b] - double-jump, wall-dodge, dodge-jump, weapon jumps, plus options for removing level barriers and momentum-based melee damage.\n[*][b]Announcer[/b] - multi-kills, killing sprees, head shots, etc.\n[*][b]Adrenaline Combos[/b] - earn points for various actions and tap a key sequence for a temporary buff.\n[*][b]Game Mode Support[/b] - play Adventure or Chaos Wastes with bots or in multiplayer, with additional options for true solo gameplay.\n[*][b]Configuration[/b] - each feature can be toggled separately.\n[/list]\n\n[b]Recommended[/b]: turn Double Tap Dodge on in the game's settings and rebind Jump/Dodge to Jump Only, to match how the original game controls.\n\n[h1]Weapons[/h1]\n[b]Shield gun[/b] - the main melee weapon of the mod, available for all characters and (almost) all careers. The primary fire charges and blasts enemies with a short ranged force wave and lets the player shield jump, while secondary blocks with a semi-transparent energy field that has an added property of reflecting some projectiles the game throws at you (even some living ones!). As an extra, which makes the gun fit better into Vermintide, the push performs a shield bash and the push attack performs an extended punch.\n\n[b]Assault rifles[/b] - this weapon allows you to trade your block and push for extra ranged firepower, as the double rifles can occupy the melee slot for Bardin's and Saltzpyre's ranged careers. The primary fire is a fairly inaccurate but very rapid stream of bullets with infinite ammo, while secondary charges and lobs a bouncy grenade that inherits your velocity and blows up on contact with enemies. The attacks count as melee, so your talents still work.\n\n[b]Shock Rifle[/b] - the impetus for this mod, this weapon was originally planned as just a variant of the beam staff, but soon expanded far beyond that initial scope. Available to all of Sienna's careers, it allows you to create a huge explosion that sucks in everything it kills by shooting the secondary energy ball with the primary energy beam. The catch is, of course, that all of that quickly uses up the heat meter, so prepare to vent a lot if you want to use this gun often. As a bonus, it has an Instagib illusion that dismembers almost everything it hits in one shot.\n\n[b]Flak Cannon[/b] - a staple of the UT series, this gun lets you shred your enemies at close range with flak shards or lob flak shells at them from afar, which also explode into shards that bounce around. Be careful around shielded enemies, as one careless shot will bounce the metal shards right back in your face. It is available for both Kruber’s and Bardin’s ranged careers.\n\n[b]Rocket Launcher[/b] - Saltzpyre's ranged careers get the rocket launcher, which can load up and shoot up to three rockets at a time. Use the primary fire while holding secondary to change how the rockets fly, and hold your crosshair on an enemy to lock on. Rocket jumps are possible, but not advisable, as they do a lot of self damage.\n\n[b]Redeemer[/b] - equipping the rocket launcher on Bounty Hunter replaces his ability with a shot from the Redeemer - a portable nuclear warhead that creates six waves of explosions, wiping out everything in its huge blast radius, including the players. Taking shelter while the blast is going off is the only way to use it relatively safely, as it doesn’t damage players through walls, making it slightly less impractical than it sounds.\n\n[b]Bio Rifle[/b] - Bardin’s unique weapon, it lobs globs of toxic green goo that damages any living creature it comes in contact with or sticks to floors, walls and ceilings, creating an improvised minefield for your enemies or yourself. The secondary allows you to charge a larger glob that bursts into smaller ones on impact.\n\n[b]Link Gun[/b] - this weapon is available to all ranged careers and lets the party link up together with the secondary fire, giving the last player (or bot) in the chain a huge boost of damage, allowing them to melt any enemy with the primary bursts of plasma.\n\n[b]Minigun[/b] - a fairly straightforward anti-horde weapon for Saltzpyre's and Kruber's ranged careers, with faster primary fire that does less damage and slower secondary that does more. Bardin's Crank Gun has nothing on this one.\n\n[b]Sniper Rifle[/b] - the classic sniper weapon for Kruber’s and Bardin’s ranged careers, it does double damage on head shots and features a 10x scope that’s overkill for most environments in this game. The annoying puff of smoke that obscures your vision after every shot, forcing you to move around, is present as well.\n\n[b]Lightning Gun[/b] - an energy-based sniper weapon for Kerillian that hits its targets even if you miss, creating sparks around the area it strikes that arc towards nearby enemies. Just like the sniper rifle, it does double damage on head shots, but uses the overheat mechanic instead of ammo.\n\n[h2]Crafting[/h2]\nThe new weapons are available in the inventory of the characters that can use them - as a 5 power Blueprint and as a 300 power Plentiful weapon.\n\nUse the weapon screen or the crafting tab to upgrade the weapons, reroll their properties and traits, and apply illusions to the ones that have them.\nUse the crafting tab to make more copies of a weapon from its Blueprint.\n\n[h1]Adrenaline[/h1]\nKill enemies in quick succession, without taking damage or in specific ways to earn adrenaline. Once you have 100, tap a key sequence to start a combo:\n[list]\n[*][b]Speed[/b] (W W W W) - run faster, jump higher and dodge without limits.\n[*][b]Booster[/b] (S S S S) - regenerate health and stamina, and get back up if you're down or grabbed.\n[*][b]Berserk[/b] (W W S S) - attack faster, with more stagger, cleave and momentum.\n[*][b]Invisibility[/b] (D D A A) - enemies lose track of you.\n[/list]\n\n[h1]Balance and Game Modes[/h1]\nThe mod was balanced around being fun for me in true solo in Adventure or with bots in Chaos Wastes, on Legend. There are options to make those playstyles easier/more convenient without needing extra mods. For multiplayer, kick the difficulty up to Cataclysm or higher. Most options are controlled by the host.\n\n[h1]Disclosures[/h1]\n[list]\n[*]The mod's code was written with [b]heavy AI assistance[/b]. No assets were AI-generated - all models, textures, effects, sounds and descriptions are converted from the original game and/or produced through code.\n[*]All assets belong to Epic Games. The following tools were used for extraction: UModel/UE Viewer for extracting assets, Ghidra for decompiling the engine's rendering code to recreate the effects. UnrealScript source code from GitHub was used as a reference.\n[/list]\n\n[h1]Known Issues[/h1]\n[list]\n[*]Reloading the mod breaks weapon icons until the next level is loaded.\n[*]Melee careers get shafted with this mod, since it's very ranged-centric - most of them only get the shield gun. Warrior Priest gets nothing because he uses a custom rig and I didn't want to support a sixth character that still wouldn't have a full arsenal.\n[*]Versus and Weaves are not supported.\n[*]The old menu layout does not allow crafting the weapons.\n[/list]\n\n[h1]Links[/h1]\n[list]\n[*][url=https://github.com/Vermintide-Mod-Framework/UnShame-Mods/tree/master/unreal_tournament]Source Code[/url] - includes the asset conversion code.\n[*][url=https://steamcommunity.com/sharedfiles/filedetails/?id=3821517994]Extras Mod[/url] - cheats, tests and dev commands.\n[/list]";
