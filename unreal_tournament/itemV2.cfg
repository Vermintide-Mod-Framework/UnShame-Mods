title = "Unreal Tournament Weapons & Movement";
description = "Experience the futuristic Unreal Tournament weapons from the distant year 2004, now in the End Times. They come with UT’s hectic movement, multi-kills, the iconic announcer and adrenaline combos.\n\n[h1]Features[/h1]\n[list]\n[*][b]11 weapons[/b] - 2 in the melee slot, 8 in the ranged slot, plus one career skill.\n[*][b]Crafting[/b] - craft, upgrade, reroll traits and apply illusions to the new weapons.\n[*][b]Movement[/b] - double-jump, wall-dodge, dodge-jump, weapon jumps, plus options for removing level barriers and momentum-based melee damage.\n[*][b]Announcer[/b] - multi-kills, killing sprees, head shots, etc.\n[*][b]Adrenaline Combos[/b] - earn points for various actions and tap a key sequence for a temporary buff.\n[*][b]Game Mode Support[/b] - play Adventure or Chaos Wastes with bots or in multiplayer, with additional options for true solo gameplay.\n[*][b]Configuration[/b] - each feature can be toggled separately.\n[/list]\n\n[b]Recommended[/b]: turn Double Tap Dodge on in the game's settings and rebind Jump/Dodge to Jump Only, to match how the original game controls.\n\n[h1]Weapons[/h1]\n[img]https://images.steamusercontent.com/ugc/18068941203045321798/131CB38A0912508D1F6D6B1544D43083E19DDFFA/[/img]\n[img]https://images.steamusercontent.com/ugc/12820123254921974730/AF8003DA5CDE0C3608E8DC10D781729ED3741BD3/[/img]\n[img]https://images.steamusercontent.com/ugc/15594779666815228029/31ED8C3CDFE6A894819EC8B6A53C6B9C04F058FA/[/img]\n[img]https://images.steamusercontent.com/ugc/14519115926142506711/2CB79779148DCDF0D5020B287BA90FA6BECD8E80/[/img]\n[img]https://images.steamusercontent.com/ugc/17366451535356600227/D1C66E96546EAAD5B68D497C9C7C68C78440D6D7/[/img]\n[img]https://images.steamusercontent.com/ugc/14655247644267685222/6BC963BA27B0BE1B249CA2B78F5858DEAAFB5606/[/img]\n[img]https://images.steamusercontent.com/ugc/12799457577890327297/64B10D8388C358E1DB2AFC94C33C13EEB3C0B07A/[/img]\n[img]https://images.steamusercontent.com/ugc/17440358261254469707/1D85B99DD0F55A82A51126C4DCB5685382CB749F/[/img]\n[img]https://images.steamusercontent.com/ugc/15780968135618574185/3C4CCC555B3CDB4CC3513E30D6A7624B28AEDBD6/[/img]\n[img]https://images.steamusercontent.com/ugc/15103507277094903356/BB433719CA0E1EC0E3A61B6EEB87D04830CF1E98/[/img]\n[img]https://images.steamusercontent.com/ugc/11287699748260636292/9F70613BCF3EEA825DEAAD9371E3C4E812DD7543/[/img]\n\n[h1]Crafting[/h1]\nThe new weapons are available in the inventory of the characters that can use them - as a 5 power Blueprint and as a 300 power Plentiful weapon.\n\nUse the weapon screen or the crafting tab to upgrade the weapons, reroll their properties and traits, and apply illusions to the ones that have them. Use the crafting tab to make more copies of a weapon from its Blueprint.\n\n[img]https://images.steamusercontent.com/ugc/13212828609946786143/451D40A1262FEFB9CD4AB19FC356B7A74F62BE90/[/img]\n\n[h1]Movement[/h1]\nThe altered movement lets you combine UT's dodges and double-jumps to quickly move around the map and avoid enemies, as well as propel yourself by shooting at your feet with select weapons. The extra mobility lets you outrun most enemies, but comes with drawbacks - it can put you in an exposed position, and the time between dodges is significantly higher than Vermintide's.\n\nThree extra movement options are available:\n[list]\n[*][b]Multidodge[/b] - disables limits on dodging.\n[*][b]Momentum Damage[/b] - melee hits do more damage the faster you move.\n[*][b]Remove Barriers[/b] - lets you explore more of the levels with the extra movement, taking away most of what keeps you in bounds.\n[/list]\n\n[h1]Adrenaline[/h1]\nKill enemies in quick succession, without taking damage or in specific ways to earn adrenaline. Once you have 100, tap a key sequence to start a combo:\n[list]\n[*][b]Speed[/b] (W W W W) - run faster, jump higher and dodge without limits.\n[*][b]Booster[/b] (S S S S) - regenerate health and stamina, and get back up if you're down or grabbed.\n[*][b]Berserk[/b] (W W S S) - attack faster, with more stagger, cleave and momentum.\n[*][b]Invisibility[/b] (D D A A) - enemies lose track of you.\n[/list]\n[img]https://images.steamusercontent.com/ugc/17825659616010993825/1442E54C60C18846C400D7CC18AB3D4D25CB4C40/[/img]\n\n[h1]Balance and Game Modes[/h1]\nThe mod was balanced around being fun for me in true solo in Adventure or with bots in Chaos Wastes, on Legend. There are options to make those playstyles easier/more convenient without needing extra mods. For multiplayer, kick the difficulty up to Cataclysm or higher. All players need the same version of the mod installed. Most options are controlled by the host.\n\n[h1]Disclosures[/h1]\n[list]\n[*]The mod's code was written with [b]heavy AI assistance[/b]. No assets were AI-generated - all models, textures, effects, sounds and descriptions are converted from the original game and/or produced through code.\n[*]All assets belong to Epic Games. The following tools were used for extraction: UModel/UE Viewer for extracting assets, Ghidra for decompiling the engine's rendering code to recreate the effects. UnrealScript source code from GitHub was used as a reference.\n[/list]\n\n[h1]Known Issues[/h1]\n[list]\n[*]Reloading the mod breaks weapon icons until the next level is loaded.\n[*]Melee careers get shafted with this mod, since it's very ranged-centric - most of them only get the shield gun. Warrior Priest gets nothing because he uses a custom rig and I didn't want to support a sixth character that still wouldn't have a full arsenal.\n[*]Versus and Weaves are not supported.\n[*]The old menu layout does not allow crafting the weapons.\n[*]Disabling the mod leaves its weapons in the inventory as their base weapons until the game is restarted. Enabling it requires a restart for them to be added back, and any that were equipped need to be equipped again.\n[/list]\n\n[h1]Links[/h1]\n[list]\n[*][url=https://github.com/Vermintide-Mod-Framework/UnShame-Mods/tree/master/unreal_tournament]Source Code[/url] - includes the asset conversion code.\n[*][url=https://steamcommunity.com/sharedfiles/filedetails/?id=3831256065]Extras Mod[/url] - chat commands and development tools.\n[/list]";
