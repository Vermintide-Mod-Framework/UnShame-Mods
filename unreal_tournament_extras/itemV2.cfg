title = "Unreal Tournament Extras";
description = "Cheats, tests and dev commands for [url=https://steamcommunity.com/sharedfiles/filedetails/?id=3814159978]Unreal Tournament Weapons & Movement[/url]. It needs that mod, and has to be below it in the load order.\n\n[h1]UT Cheats[/h1]\n[list]\n[*][b]/god[/b] - take no damage.\n[*][b]/allammo[/b] - fill your ammo.\n[*][b]/fly[/b], [b]/ghost[/b] - fly where you look, through walls with ghost. [b]/walk[/b] ends both.\n[*][b]/suicide[/b] - die at once.\n[*][b]/addbots[/b], [b]/killbots[/b] - add or remove hero bots.\n[*][b]/hud[/b] - hide the HUD, crosshair and weapon. [b]/hud 1[/b] keeps the weapon.\n[*][b]/freecamera[/b] - a third person camera you can turn around your character.\n[*][b]/slomo[/b] - change the game speed. 0 stops time.\n[/list]\n\n[h1]Other Commands[/h1]\n[list]\n[*][b]/recharge[/b] - fill your career skill and adrenaline.\n[*][b]/ut_level[/b] - load any level, with an optional weather and difficulty.\n[/list]\n\n[h1]Development[/h1]\nIn-game tests for every weapon ([b]/ut_test[/b]), and commands for spawning enemies, teleporting and checking the weapon models, which were used to make the mod.\n\n[h1]Links[/h1]\n[list]\n[*][url=https://github.com/Vermintide-Mod-Framework/UnShame-Mods/tree/master/unreal_tournament_extras]Source Code[/url]\n[/list]";
